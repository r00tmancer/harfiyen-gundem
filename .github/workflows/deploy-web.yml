name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Wrangler binding tiplerini doğrula
        run: npm exec -w worker wrangler -- types src/worker-configuration.d.ts --include-runtime false --check
      - name: Cloudflare API adresini doğrula
        env:
          API_URL: ${{ vars.API_URL }}
        run: test -n "$API_URL"
      - run: npm run build -w web
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # Worker adresi: gh variable set API_URL --body "https://harfiyen-gundem.<hesap>.workers.dev"
          VITE_API_URL: ${{ vars.API_URL }}
      - name: gh-pages dalına yayınla
        run: |
          cd web/dist
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
